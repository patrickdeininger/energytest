# Tier-B full-scale: the 3 frontier models with reasoning ENABLED on the full N=1549
# (same seed/sample as the main run, so it pairs against their direct-mode scores).
# 4096-token budget so reasoning is not truncated (the main run capped Gemini at 256).
# Est. ~$66 at OpenRouter reasoning-token pricing; ~1.5-2.5 h at concurrency 10.
run_name: primevul_reasoning_full
seed: 12345
dataset:
  source: jsonl
  path: harness/data/primevul/primevul_test.jsonl
  code_field: func
  label_field: target
  id_field: idx
  cwe_field: cwe
  n: 2000
  stratify_by: label
task: vuln_detect_binary
concurrency: 10
models:
  - id: claude-sonnet-5-reasoning
    backend: api
    params: { provider: openrouter, model: anthropic/claude-sonnet-5, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 2.0, out: 10.0 }
  - id: gpt-5.1-reasoning
    backend: api
    params: { provider: openrouter, model: openai/gpt-5.1, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 1.25, out: 10.0 }
  - id: gemini-3.1-pro-reasoning
    backend: api
    params: { provider: openrouter, model: google/gemini-3.1-pro-preview, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 2.0, out: 12.0 }
meters: [cost, latency, energy_estimated]
reps: 1
gen:
  temperature: 0.0
  max_output_tokens: 4096
  max_code_chars: 8000
output_dir: harness/runs
