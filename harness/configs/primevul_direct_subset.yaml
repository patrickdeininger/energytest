# Paired reference for primevul_reasoning_subset: the same N=300 stratified subset
# (seed 12345), Claude and GPT in DIRECT mode (reasoning off, max_output 64), so the
# reasoning-vs-direct delta is measured on identical tasks. Gemini has no direct mode
# and is omitted. ~$1.
run_name: primevul_direct_subset
seed: 12345
dataset:
  source: jsonl
  path: harness/data/primevul/primevul_test.jsonl
  code_field: func
  label_field: target
  id_field: idx
  cwe_field: cwe
  n: 300
  stratify_by: label
task: vuln_detect_binary
concurrency: 8
models:
  - id: claude-sonnet-5-direct
    backend: api
    params: { provider: openrouter, model: anthropic/claude-sonnet-5, active_params_b: 100, reasoning: { enabled: false } }
    price: { in: 2.0, out: 10.0 }
  - id: gpt-5.1-direct
    backend: api
    params: { provider: openrouter, model: openai/gpt-5.1, active_params_b: 100, reasoning: { enabled: false } }
    price: { in: 1.25, out: 10.0 }
meters: [cost, latency, energy_estimated]
reps: 1
gen:
  temperature: 0.0
  max_output_tokens: 64
  max_code_chars: 8000
output_dir: harness/runs
