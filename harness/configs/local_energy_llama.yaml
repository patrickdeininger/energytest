# MEASURED energy for Llama-3.3-70B (FP8) on a single H200 (M3).
#   bash harness/scripts/run_local_energy.sh RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic harness/configs/local_energy_llama.yaml
# FP8 (~70 GB) is REQUIRED on a single H200: bf16 (140 GB) leaves no VRAM for KV
# cache on the 141 GB card, and doesn't fit a 100 GB disk. FP8 is a realistic,
# standard 70B deployment; record the precision (FP8) in the paper.
# If the repo is gated, accept the license on its HF page; HF_TOKEN must be set.
# idle_power_w preset to 75.63 (this pod's measured idle); adjust if different.
run_name: local_energy_llama
seed: 12345
dataset:
  source: jsonl
  path: harness/data/primevul/primevul_test.jsonl
  code_field: func
  label_field: target
  id_field: idx
  cwe_field: cwe
  n: 300
  stratify_by: label
task: vuln_detect_binary
concurrency: 1
models:
  - id: llama-3.3-70b-measured
    backend: api
    params:
      provider: vllm
      model: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic   # FP8, fits one H200 + 100GB disk
      idle_power_w: 75.63
      gpu_index: 0
    price: { in: 0.0, out: 0.0 }
meters: [latency, energy_measured]
reps: 1
gen:
  temperature: 0.0
  max_output_tokens: 64
  max_code_chars: 8000
output_dir: harness/runs
