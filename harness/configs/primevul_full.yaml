# FULL PrimeVul run — 8 models (3 frontier + 5 open) x N=2000 stratified x 1 rep.
# Slugs + prices verified on OpenRouter 2026-07-04. Energy is ESTIMATED here
# (FLOP-based); measured open-side energy for the local-feasible models comes at
# M3. active_params_b for frontier is a bounded assumption (~100B) — report with
# a sensitivity range in the paper. max_code_chars caps the long-function tail.
run_name: primevul_full
seed: 12345
dataset:
  source: jsonl
  path: harness/data/primevul/primevul_test.jsonl
  code_field: func
  label_field: target
  id_field: idx
  cwe_field: cwe
  n: 2000
  stratify_by: label
task: vuln_detect_binary
concurrency: 10
models:
  # --- Frontier (API; energy estimated, active params unknown -> ~100B assumed) ---
  - id: claude-sonnet-5
    backend: api
    params: { provider: openrouter, model: anthropic/claude-sonnet-5, active_params_b: 100 }
    price: { in: 2.0, out: 10.0 }
  - id: gpt-5.1
    backend: api
    params: { provider: openrouter, model: openai/gpt-5.1, active_params_b: 100 }
    price: { in: 1.25, out: 10.0 }
  - id: gemini-3.1-pro
    backend: api
    params: { provider: openrouter, model: google/gemini-3.1-pro-preview, active_params_b: 100 }
    price: { in: 2.0, out: 12.0 }
  # --- Open-weight (size-tiered; small ones become measured-energy at M3) ---
  - id: gemma-3-4b
    backend: api
    params: { provider: openrouter, model: google/gemma-3-4b-it, active_params_b: 4 }
    price: { in: 0.05, out: 0.10 }
  - id: qwen3-coder-30b
    backend: api
    params: { provider: openrouter, model: qwen/qwen3-coder-30b-a3b-instruct, active_params_b: 3 }
    price: { in: 0.07, out: 0.27 }
  - id: llama-3.3-70b
    backend: api
    params: { provider: openrouter, model: meta-llama/llama-3.3-70b-instruct, active_params_b: 70 }
    price: { in: 0.10, out: 0.32 }
  - id: deepseek-v3.2
    backend: api
    params: { provider: openrouter, model: deepseek/deepseek-v3.2, active_params_b: 37 }
    price: { in: 0.23, out: 0.34 }
  - id: glm-5
    backend: api
    params: { provider: openrouter, model: z-ai/glm-5, active_params_b: 32 }
    price: { in: 0.60, out: 1.92 }
meters: [cost, latency, energy_estimated]
reps: 1
gen:
  temperature: 0.0
  max_output_tokens: 64
  max_code_chars: 8000   # ~2000 tokens; caps long PrimeVul functions
output_dir: harness/runs
