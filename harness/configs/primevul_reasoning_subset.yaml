# Tier-B: does reasoning save the frontier? Re-run the 3 frontier models with
# reasoning ENABLED on an N=300 stratified subset (seed 12345), to test whether the
# open-beats-frontier ranking survives when frontier models are allowed to reason
# (the main run used direct-answer mode). Gemini is reasoning-only anyway; Claude and
# GPT are flipped to reasoning on. max_output 4096 so thinking + verdict both fit.
# Est. ~$12-24 at OpenRouter reasoning-token pricing.
run_name: primevul_reasoning_subset
seed: 12345
dataset:
  source: jsonl
  path: harness/data/primevul/primevul_test.jsonl
  code_field: func
  label_field: target
  id_field: idx
  cwe_field: cwe
  n: 300
  stratify_by: label
task: vuln_detect_binary
concurrency: 8
models:
  - id: claude-sonnet-5-reasoning
    backend: api
    params: { provider: openrouter, model: anthropic/claude-sonnet-5, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 2.0, out: 10.0 }
  - id: gpt-5.1-reasoning
    backend: api
    params: { provider: openrouter, model: openai/gpt-5.1, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 1.25, out: 10.0 }
  - id: gemini-3.1-pro-reasoning
    backend: api
    params: { provider: openrouter, model: google/gemini-3.1-pro-preview, active_params_b: 100, reasoning: { enabled: true } }
    price: { in: 2.0, out: 12.0 }
meters: [cost, latency, energy_estimated]
reps: 1
gen:
  temperature: 0.0
  max_output_tokens: 4096
  max_code_chars: 8000
output_dir: harness/runs
